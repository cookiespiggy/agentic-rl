- verl 配置 key 快照 —— 供 tools/check_verl_configs.py 离线校验教程里的 Hydra 覆盖项。
- 来源：verl v0.9.1 的**预合成**配置 verl/trainer/config/_generated_ppo_trainer.yaml
- （Hydra 合并后的最终形态，按构造即权威；不需要装 verl、不需要解析 hydra 语义）。
- known_keys 含所有中间节点（用于「父节点是自由透传 dict」的自由放行判定）。
- verl 配置面变化很快；verl 升级后请重新生成本文件。
